<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genealogia Portugal — Pesquisa de Óbitos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0f1117; --bg2: #1a1d27; --bg3: #22263a; --border: #2e3347; --text: #e8eaf6; --text2: #8b93b8; --accent: #6c63ff; --accent2: #8b83ff; --green: #22c55e; --radius: 12px; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
        .topbar { background: var(--bg2); border-bottom: 1px solid var(--border); padding: 0 24px; height: 60px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 1.1rem; font-weight: 700; color: var(--text); text-decoration: none; display: flex; align-items: center; gap: 8px; }
        .logo span { color: var(--accent2); }
        .nav-links { display: flex; gap: 16px; }
        .nav-link { color: var(--text2); text-decoration: none; font-size: 0.95rem; font-weight: 500; transition: color .2s; }
        .nav-link:hover, .nav-link.active { color: var(--text); }
        .hero { text-align: center; padding: 50px 20px 30px; }
        .hero h1 { font-size: 2.5rem; font-weight: 700; margin-bottom: 12px; letter-spacing: -0.5px; }
        .hero p { color: var(--text2); font-size: 1.1rem; max-width: 650px; margin: 0 auto; line-height: 1.5; }
        .search-container { max-width: 750px; margin: 0 auto 30px; padding: 0 20px; }
        .search-box { display: flex; background: var(--bg2); border: 2px solid var(--border); border-radius: 100px; padding: 6px; transition: .3s; }
        .search-box:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(108,99,255,0.15); }
        .search-input { flex: 1; background: transparent; border: none; color: var(--text); font-size: 1.1rem; padding: 12px 24px; outline: none; font-family: inherit; }
        .search-btn { background: var(--accent); color: white; border: none; border-radius: 100px; padding: 0 32px; font-weight: 600; font-size: 1rem; cursor: pointer; transition: .2s; font-family: inherit; }
        .search-btn:hover { background: var(--accent2); }
        .stats-bar { display: flex; justify-content: center; gap: 16px; padding: 16px 24px; background: var(--bg2); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
        .stat-chip { padding: 6px 16px; border-radius: 100px; font-size: 0.9rem; font-weight: 500; background: var(--bg3); border: 1px solid var(--border); color: var(--text2); display: flex; gap: 6px; }
        .stat-chip span { color: var(--text); font-weight: 600; }
        .results-container { max-width: 1000px; margin: 0 auto 60px; padding: 0 20px; width: 100%; }
        .result-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px; margin-bottom: 16px; transition: .2s; position: relative; }
        .result-card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.2); }
        .result-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; flex-wrap: wrap; gap: 10px; }
        .result-name { font-size: 1.25rem; font-weight: 600; color: var(--text); }
        .result-badge { background: rgba(108,99,255,0.15); color: var(--accent2); font-size: 0.8rem; padding: 4px 10px; border-radius: 20px; font-weight: 500; border: 1px solid rgba(108,99,255,0.3); }
        .result-meta { display: flex; gap: 20px; color: var(--text2); font-size: 0.92rem; flex-wrap: wrap; margin-bottom: 12px; }
        .result-meta span { display: flex; align-items: center; gap: 6px; }
        .result-relations { background: var(--bg3); border-radius: 8px; padding: 10px 14px; font-size: 0.88px; color: var(--text2); display: flex; gap: 16px; flex-wrap: wrap; margin-top: 10px; border: 1px solid var(--border); }
        .result-relations div { display: flex; gap: 6px; }
        .result-relations span { color: var(--text); font-weight: 500; }
        .result-footer { display: flex; justify-content: flex-end; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); }
        .doc-link { background: var(--bg3); color: var(--text); text-decoration: none; font-size: 0.85rem; padding: 6px 14px; border-radius: 8px; border: 1px solid var(--border); transition: .2s; display: inline-flex; align-items: center; gap: 6px; font-weight: 500; }
        .doc-link:hover { background: var(--accent); border-color: var(--accent); color: white; }
        .loading { text-align: center; padding: 60px; color: var(--text2); font-size: 1.05rem; }
    </style>
</head>
<body>
    <div class="topbar">
        <a href="/" class="logo">Genealogia <span>Portugal</span></a>
        <div class="nav-links">
            <a href="/" class="nav-link active">Pesquisa</a>
            <a href="/mapa" class="nav-link">Mapa</a>
            <a href="/validar" class="nav-link">Revisão</a>
        </div>
    </div>

    <div class="stats-bar">
        <div class="stat-chip">Total Registos: <span id="totalCount">8.754</span></div>
        <div class="stat-chip">Com Data: <span id="dateCount">5.260</span></div>
        <div class="stat-chip">Concelho: <span>Celorico da Beira</span></div>
    </div>

    <div class="hero">
        <h1>Descobre a tua história</h1>
        <p>Pesquisa inteligente em milhares de registos paroquiais e de óbitos digitalizados de Portugal.</p>
    </div>

    <div class="search-container">
        <div class="search-box">
            <input type="text" id="searchInput" class="search-input" placeholder="Pesquisar por nome (ex: Maria Silva), freguesia ou data...">
            <button id="searchBtn" class="search-btn">Pesquisar</button>
        </div>
        <div style="display: flex; gap: 8px; justify-content: center; margin-top: 14px; flex-wrap: wrap;" id="parishFilters">
            <span style="color: var(--text2); font-size: 0.85rem; align-self: center;">Freguesias:</span>
            <button class="parish-tag active" onclick="filterByParish('')">Todas</button>
            <button class="parish-tag" onclick="filterByParish('Santa Maria')">Santa Maria</button>
            <button class="parish-tag" onclick="filterByParish('São Pedro')">São Pedro</button>
            <button class="parish-tag" onclick="filterByParish('Mesquitela')">Mesquitela</button>
            <button class="parish-tag" onclick="filterByParish('Baraçal')">Baraçal</button>
            <button class="parish-tag" onclick="filterByParish('Cadafaz')">Cadafaz</button>
            <button class="parish-tag" onclick="filterByParish('Carrapichana')">Carrapichana</button>
            <button class="parish-tag" onclick="filterByParish('Açores')">Açores</button>
            <button class="parish-tag" onclick="filterByParish('Lajeosa')">Lajeosa</button>
            <button class="parish-tag" onclick="filterByParish('Cortiço')">Cortiço da Serra</button>
        </div>
        <div style="display: flex; gap: 8px; justify-content: center; margin-top: 14px; flex-wrap: wrap;">
            <span style="color: var(--text2); font-size: 0.85rem; align-self: center;">Ano:</span>
            <input type="number" id="fromYear" class="year-input" placeholder="De (ex: 1700)" min="1600" max="2000">
            <span style="color: var(--text2); align-self: center;">→</span>
            <input type="number" id="toYear" class="year-input" placeholder="Até (ex: 1900)" min="1600" max="2000">
            <button class="parish-tag" onclick="resetYear()">Todos os anos</button>
        </div>
    </div>

    <div style="max-width: 1000px; margin: 0 auto 10px; padding: 0 20px; display: flex; justify-content: space-between; align-items: center;">
        <span id="resultsCount" style="color: var(--text2); font-size: 0.9rem;">A carregar...</span>
    </div>

    <div class="results-container" id="resultsContainer">
        <div class="loading">A carregar registos recentes...</div>
    </div>

    <!-- Modal de Detalhe -->
    <div id="detailModal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 1000; align-items: center; justify-content: center; padding: 20px;">
        <div style="background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); max-width: 700px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 28px; position: relative;">
            <button onclick="closeModal()" style="position: absolute; top: 20px; right: 20px; background: var(--bg3); border: 1px solid var(--border); color: var(--text); width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-size: 1rem; display: flex; align-items: center; justify-content: center;">✕</button>
            <div id="modalContent"></div>
        </div>
    </div>

    <style>
        .parish-tag { background: var(--bg2); border: 1px solid var(--border); color: var(--text2); padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; cursor: pointer; transition: .2s; }
        .parish-tag:hover, .parish-tag.active { background: var(--accent); color: white; border-color: var(--accent); }
        .year-input { background: var(--bg2); border: 1px solid var(--border); color: var(--text); padding: 4px 10px; border-radius: 8px; font-size: 0.8rem; width: 110px; }
        .year-input:focus { outline: none; border-color: var(--accent); }
    </style>

    <script>
        const SUPABASE_URL = 'https://qljopxbxgflozrcdblrl.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_-oWYfk9uhb5DIByIe7xUhw_jb_touP1';
        
        const headers = {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`,
            'Content-Type': 'application/json'
        };

        let currentParish = '';
        let currentFromYear = '';
        let currentToYear = '';

        async function loadInitial() {
            try {
                // Selecionar um lote aleatório para variar os nomes apresentados a cada visita
                const randomOffset = Math.floor(Math.random() * 5000);
                const response = await fetch(`${SUPABASE_URL}/rest/v1/pessoas?select=*&limit=50&offset=${randomOffset}`, { headers });
                if (!response.ok) throw new Error('Erro ao ligar à base de dados');
                const data = await response.json();
                renderResults(data);
            } catch (err) {
                document.getElementById('resultsContainer').innerHTML = `<div class="loading" style="color:#ef4444">Erro ao carregar dados: ${err.message}</div>`;
            }
        }

        async function performSearch() {
            const query = document.getElementById('searchInput').value.trim();
            const container = document.getElementById('resultsContainer');
            container.innerHTML = '<div class="loading">A pesquisar na base de dados...</div>';

            try {
                let url = `${SUPABASE_URL}/rest/v1/pessoas?select=*&order=criado_em.desc&limit=100`;
                let conditions = [];
                if (query) {
                    conditions.push(`or(nome.ilike.*${query}*,sobrenome.ilike.*${query}*,freguesia.ilike.*${query}*)`);
                }
                if (currentParish) {
                    conditions.push(`freguesia.ilike.*${currentParish}*`);
                }
                if (currentFromYear) {
                    conditions.push(`data_obito.gte.${currentFromYear}-01-01`);
                }
                if (currentToYear) {
                    conditions.push(`data_obito.lte.${currentToYear}-12-31`);
                }
                if (conditions.length > 0) {
                    url += '&' + conditions.join('&');
                }
                const response = await fetch(url, { headers });
                if (!response.ok) throw new Error('Erro na pesquisa');
                const data = await response.json();
                renderResults(data);
            } catch (err) {
                container.innerHTML = `<div class="loading" style="color:#ef4444">Erro na pesquisa: ${err.message}</div>`;
            }
        }

        function filterByParish(parish) {
            currentParish = parish;
            document.querySelectorAll('.parish-tag').forEach(btn => {
                btn.classList.toggle('active', btn.textContent.includes(parish || 'Todas'));
            });
            performSearch();
        }

        function applyYearFilter() {
            const from = document.getElementById('fromYear').value.trim();
            const to = document.getElementById('toYear').value.trim();
            currentFromYear = from && /^\d{4}$/.test(from) ? from : '';
            currentToYear = to && /^\d{4}$/.test(to) ? to : '';
            performSearch();
        }

        function resetYear() {
            document.getElementById('fromYear').value = '';
            document.getElementById('toYear').value = '';
            currentFromYear = '';
            currentToYear = '';
            performSearch();
        }

        function renderResults(data) {
            const container = document.getElementById('resultsContainer');
            const countEl = document.getElementById('resultsCount');
            countEl.textContent = `A mostrar ${data.length} registos`;

            if (!data || data.length === 0) {
                container.innerHTML = '<div class="loading">Nenhum registo encontrado com esses critérios.</div>';
                return;
            }

            container.innerHTML = data.map((person, index) => {
                const fullName = `${person.nome || ''} ${person.sobrenome || ''}`.trim() || 'Registo Anónimo';
                const dataObito = person.data_obito ? new Date(person.data_obito).toLocaleDateString('pt-PT') : 'Data não especificada';
                const freguesia = person.freguesia || 'Celorico da Beira';
                const concelho = person.concelho || 'Celorico da Beira';
                
                let relationsHtml = '';
                if (person.pai || person.mae || person.conjuge) {
                    relationsHtml = `
                        <div class="result-relations" style="font-size:0.85rem;">
                            ${person.pai ? `<div>Pai: <span>${person.pai}</span></div>` : ''}
                            ${person.mae ? `<div>Mãe: <span>${person.mae}</span></div>` : ''}
                            ${person.conjuge ? `<div>Cônjuge: <span>${person.conjuge}</span></div>` : ''}
                        </div>
                    `;
                }

                let docLinkHtml = '';
                if (person.imagem_url) {
                    docLinkHtml = `
                        <a href="${person.imagem_url}" target="_blank" class="doc-link" onclick="event.stopPropagation()">
                            📄 Ver Documento Original ↗
                        </a>
                    `;
                }

                return `
                    <div class="result-card" onclick="openDetail(${JSON.stringify(person).replace(/"/g, '&quot;')})" style="cursor: pointer;">
                        <div class="result-header">
                            <div class="result-name">${fullName}</div>
                            <div class="result-badge">Óbito</div>
                        </div>
                        <div class="result-meta">
                            <span>📅 ${dataObito}</span>
                            <span>📍 ${freguesia}, ${concelho}</span>
                        </div>
                        ${relationsHtml}
                        <div class="result-footer">
                            <span style="color: var(--accent2); font-size: 0.85rem; align-self: center;">Ver transcrição completa ➔</span>
                            ${docLinkHtml}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function openDetail(person) {
            const modal = document.getElementById('detailModal');
            const content = document.getElementById('modalContent');
            const fullName = `${person.nome || ''} ${person.sobrenome || ''}`.trim() || 'Registo Anónimo';
            
            content.innerHTML = `
                <h2 style="font-size: 1.5rem; margin-bottom: 16px; color: var(--text);">${fullName}</h2>
                <div style="display: grid; gap: 12px; margin-bottom: 20px; color: var(--text2); font-size: 0.95rem;">
                    <div><strong>Data de Óbito:</strong> <span style="color:var(--text);">${person.data_obito ? new Date(person.data_obito).toLocaleDateString('pt-PT') : 'Não especificada'}</span></div>
                    <div><strong>Freguesia:</strong> <span style="color:var(--text);">${person.freguesia || 'Celorico da Beira'}</span></div>
                    <div><strong>Concelho / Distrito:</strong> <span style="color:var(--text);">${person.concelho || 'Celorico'} / ${person.distrito || 'Guarda'}</span></div>
                    ${person.pai ? `<div><strong>Pai:</strong> <span style="color:var(--text);">${person.pai}</span></div>` : ''}
                    ${person.mae ? `<div><strong>Mãe:</strong> <span style="color:var(--text);">${person.mae}</span></div>` : ''}
                    ${person.conjuge ? `<div><strong>Cônjuge:</strong> <span style="color:var(--text);">${person.conjuge}</span></div>` : ''}
                </div>
                ${person.imagem_url ? `
                    <div style="margin-bottom: 20px;">
                        <a href="${person.imagem_url}" target="_blank" class="doc-link" style="display: inline-block; padding: 10px 20px; background: var(--accent); color: white; border-color: var(--accent);">
                            📄 Abrir Imagem Original no Digitarq ↗
                        </a>
                    </div>
                ` : ''}
                ${person.texto_original ? `
                    <div>
                        <h4 style="margin-bottom: 8px; color: var(--text);">Transcrição do Registo (HTR):</h4>
                        <div style="background: var(--bg); padding: 14px; border-radius: 8px; border: 1px solid var(--border); font-family: monospace; font-size: 0.85rem; color: var(--text2); max-height: 200px; overflow-y: auto; white-space: pre-wrap;">${person.texto_original}</div>
                    </div>
                ` : ''}
            `;
            modal.style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('detailModal').style.display = 'none';
        }

        window.onclick = function(event) {
            const modal = document.getElementById('detailModal');
            if (event.target === modal) closeModal();
        }

        document.getElementById('searchBtn').addEventListener('click', performSearch);
        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') performSearch();
        });
        document.getElementById('fromYear').addEventListener('change', applyYearFilter);
        document.getElementById('fromYear').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') applyYearFilter();
        });
        document.getElementById('toYear').addEventListener('change', applyYearFilter);
        document.getElementById('toYear').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') applyYearFilter();
        });

        loadInitial();
    </script>
</body>
</html>
