<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genealogia Portugal — Pesquisa</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0f1117; --bg2: #1a1d27; --bg3: #22263a; --border: #2e3347; --text: #e8eaf6; --text2: #8b93b8; --accent: #6c63ff; --accent2: #8b83ff; --green: #22c55e; --radius: 12px; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
        .topbar { background: var(--bg2); border-bottom: 1px solid var(--border); padding: 0 24px; height: 60px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 1.1rem; font-weight: 700; color: var(--text); text-decoration: none; }
        .logo span { color: var(--accent2); }
        .hero { text-align: center; padding: 60px 20px 40px; }
        .hero h1 { font-size: 2.5rem; font-weight: 700; margin-bottom: 16px; letter-spacing: -0.5px; }
        .hero p { color: var(--text2); font-size: 1.1rem; max-width: 600px; margin: 0 auto; line-height: 1.5; }
        .search-container { max-width: 700px; margin: 0 auto 40px; padding: 0 20px; }
        .search-box { display: flex; background: var(--bg2); border: 2px solid var(--border); border-radius: 100px; padding: 6px; transition: .3s; }
        .search-box:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px rgba(108,99,255,0.1); }
        .search-input { flex: 1; background: transparent; border: none; color: var(--text); font-size: 1.1rem; padding: 12px 20px; outline: none; font-family: inherit; }
        .search-btn { background: var(--accent); color: white; border: none; border-radius: 100px; padding: 0 32px; font-weight: 600; font-size: 1rem; cursor: pointer; transition: .2s; font-family: inherit; }
        .search-btn:hover { background: var(--accent2); }
        .results-container { max-width: 1000px; margin: 0 auto; padding: 0 20px; }
        .result-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; transition: .2s; }
        .result-card:hover { border-color: var(--accent); transform: translateY(-2px); }
        .result-name { font-size: 1.2rem; font-weight: 600; color: var(--text); margin-bottom: 8px; }
        .result-meta { display: flex; gap: 16px; color: var(--text2); font-size: 0.9rem; flex-wrap: wrap; }
        .result-meta span { display: flex; align-items: center; gap: 6px; }
        .result-meta .icon { color: var(--accent2); }
        .loading { text-align: center; padding: 40px; color: var(--text2); }
        .stats-bar { display: flex; gap: 12px; padding: 16px 24px; background: var(--bg2); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
        .stat-chip { padding: 6px 14px; border-radius: 100px; font-size: 0.85rem; font-weight: 500; background: var(--bg3); border: 1px solid var(--border); color: var(--text2); }
        .stat-chip.active { background: var(--accent); color: white; border-color: var(--accent); }
    </style>
</head>
<body>
    <div class="topbar">
        <a href="#" class="logo">Genealogia <span>Portugal</span></a>
        <nav class="nav-links">
            <a href="#" class="nav-link active">Pesquisa</a>
            <a href="review.html" class="nav-link">Revisão</a>
        </nav>
    </div>

    <div class="stats-bar" id="statsBar">
        <div class="stat-chip">Total: <span id="totalCount">...</span></div>
        <div class="stat-chip">Com Data: <span id="dateCount">...</span></div>
        <div class="stat-chip">Freguesias: <span id="freguesiaCount">...</span></div>
    </div>

    <div class="hero">
        <h1>Descobre a tua história</h1>
        <p>Pesquisa em registos de óbitos de Celorico da Beira. Mais de 850 pessoas transcritas e digitalizadas.</p>
    </div>

    <div class="search-container">
        <div class="search-box">
            <input type="text" id="searchInput" class="search-input" placeholder="Pesquisar por nome, freguesia ou data...">
            <button id="searchBtn" class="search-btn">Pesquisar</button>
        </div>
    </div>

    <div class="results-container" id="resultsContainer">
        <div class="loading">A carregar dados...</div>
    </div>

    <script>
        // Configuração Supabase (Vai buscar às variáveis de ambiente do Vercel)
        const SUPABASE_URL = import.meta.env?.VITE_SUPABASE_URL || 'https://qljopxbxgflozrcdblrl.supabase.co';
        const SUPABASE_KEY = import.meta.env?.VITE_SUPABASE_KEY || 'sb_publishable_-oWYfk9uhb5DIByIe7xUhw_jb_touP1';
        
        const headers = {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`,
            'Content-Type': 'application/json'
        };

        let allData = [];
        let filteredData = [];

        // Carregar dados iniciais
        async function loadData() {
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/pessoas?select=*&limit=2000`, { headers });
                if (!response.ok) throw new Error('Erro ao carregar dados');
                allData = await response.json();
                
                // Atualizar estatísticas
                const total = allData.length;
                const withDate = allData.filter(p => p.data_obito).length;
                const freguesias = new Set(allData.map(p => p.freguesia).filter(Boolean)).size;
                
                document.getElementById('totalCount').textContent = total;
                document.getElementById('dateCount').textContent = withDate;
                document.getElementById('freguesiaCount').textContent = freguesias;
                
                filteredData = allData;
                renderResults(filteredData);
            } catch (error) {
                document.getElementById('resultsContainer').innerHTML = `<div class="loading" style="color:var(--red)">Erro: ${error.message}</div>`;
            }
        }

        // Renderizar resultados
        function renderResults(data) {
            const container = document.getElementById('resultsContainer');
            if (data.length === 0) {
                container.innerHTML = '<div class="loading">Nenhum resultado encontrado.</div>';
                return;
            }

            container.innerHTML = data.map(person => {
                const nome = `${person.nome || ''} ${person.sobrenome || ''}`.trim() || 'Desconhecido';
                const dataObito = person.data_obito ? new Date(person.data_obito).toLocaleDateString('pt-PT') : 'Sem data';
                const freguesia = person.freguesia || 'Celorico da Beira';
                
                return `
                    <div class="result-card">
                        <div class="result-name">${nome}</div>
                        <div class="result-meta">
                            <span><span class="icon">📅</span> ${dataObito}</span>
                            <span><span class="icon">📍</span> ${freguesia}</span>
                            ${person.concelho ? `<span><span class="icon">🏛️</span> ${person.concelho}</span>` : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Pesquisa
        document.getElementById('searchBtn').addEventListener('click', performSearch);
        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') performSearch();
        });

        function performSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            if (!query) {
                filteredData = allData;
            } else {
                filteredData = allData.filter(person => {
                    const nome = `${person.nome || ''} ${person.sobrenome || ''}`.toLowerCase();
                    const freguesia = (person.freguesia || '').toLowerCase();
                    const data = (person.data_obito || '').toLowerCase();
                    return nome.includes(query) || freguesia.includes(query) || data.includes(query);
                });
            }
            renderResults(filteredData);
        }

        // Iniciar
        loadData();
    </script>
</body>
</html>
