<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de Óbitos - Celorico da Beira</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        #map { height: 80vh; width: 100%; border-radius: 0.5rem; }
    </style>
</head>
<body class="bg-gray-100">
    <nav class="bg-green-800 text-white p-4">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold">🗺️ Distribuição Geográfica</h1>
            <div class="flex gap-4">
                <a href="/" class="hover:text-green-200">Início</a>
                <a href="/family-tree" class="hover:text-green-200">Árvore</a>
                <a href="/validar" class="hover:text-green-200">Validar</a>
            </div>
        </div>
    </nav>

    <div class="container mx-auto p-4">
        <div class="bg-white p-4 rounded shadow mb-4">
            <h2 class="text-xl font-semibold mb-2">Análise de Registos por Freguesia</h2>
            <p class="text-gray-600">Clique nos marcadores para ver o número de registos extraídos em cada freguesia.</p>
        </div>
        <div id="map"></div>
    </div>

    <script>
        const map = L.map('map').setView([40.44, -7.55], 11);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        async function loadMapData() {
            try {
                const resp = await fetch('/api/mapa');
                const data = await resp.json();

                data.forEach(item => {
                    const radius = Math.max(5, Math.sqrt(item.count) * 2);
                    L.circleMarker([item.coords[0], item.coords[1]], {
                        radius: radius,
                        fillColor: '#10b981',
                        color: '#059669',
                        weight: 1,
                        opacity: 1,
                        fillOpacity: 0.6
                    })
                    .bindPopup(`<strong>${item.freguesia}</strong><br>${item.count} registos`)
                    .addTo(map);
                });
            } catch (e) {
                console.error("Erro ao carregar dados do mapa:", e);
            }
        }

        loadMapData();
    </script>
</body>
</html>
